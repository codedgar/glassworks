<!doctype html><meta charset="utf-8"><title>html2canvas only</title>
<style>body{margin:0;background:#cde}.box{width:400px;height:200px;background:#3cb44b;margin:40px}
.lens{position:absolute;left:60px;top:60px;width:300px;height:120px;border-radius:16px}</style>
<div class="box">content behind the lens</div><div class="lens"></div>
<script>window.LIQUIDGL_HTML2CANVAS_URL = "/node_modules/html2canvas/dist/html2canvas.min.js";</script>
<script src="/scripts/liquidGL.js"></script>
<script>
  window.__inited = false;
  window.glassworks({ target: ".lens", engine: "html2canvas", reveal: "none", specular: false, shadow: false,
    on: { init: function () { window.__inited = true; } } });
</script>
