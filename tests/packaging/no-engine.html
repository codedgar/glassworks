<!doctype html><meta charset="utf-8"><title>no engine</title>
<style>body{margin:0;background:#cde}.box{width:400px;height:200px;background:#3cb44b;margin:40px}
.lens{position:absolute;left:60px;top:60px;width:300px;height:120px;border-radius:16px}</style>
<div class="box">content behind the lens</div><div class="lens"></div>
<script src="/scripts/liquidGL.js"></script>
<script>
  /* No snapdom, no html2canvas, and no lazy-load URL that resolves offline. */
  window.__errors = [];
  window.__origError = console.error;
  console.error = function () { window.__errors.push([].slice.call(arguments).join(" ")); window.__origError.apply(console, arguments); };
  window.__inited = false;
  try {
    window.__lens = window.glassworks({ target: ".lens", reveal: "none", specular: false, shadow: false,
      on: { init: function () { window.__inited = true; } } });
  } catch (e) { window.__syncThrow = String(e && e.message); }
</script>
